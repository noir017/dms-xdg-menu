name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the menu parser, favorites, plugin.json and translations
        run: node --test tests/*.test.mjs

  # Publishes plugin.json's version once: tags v<version> and attaches xdgMenu.zip.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
    steps:
      - uses: actions/checkout@v7
      - name: Read the version
        id: version
        run: echo "tag=v$(jq -r .version plugin.json)" >> "$GITHUB_OUTPUT"
      - name: Check whether it is released
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        if: steps.tag.outputs.exists == 'false'
        run: scripts/package.sh
      - name: Publish the release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/xdgMenu.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
